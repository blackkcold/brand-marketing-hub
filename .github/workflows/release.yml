name: Auto Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release commit
        id: commit
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.commit.outputs.sha }}
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION=$(awk '/^version:/ {print $2; exit}' SKILL.md)
          if [ -z "$VERSION" ]; then
            echo "Unable to resolve version from SKILL.md" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Detect releasable changelog section
        id: releasable
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if grep -Fq "## [$TAG]" CHANGELOG.md; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "No CHANGELOG release section for $TAG; skipping release."
            echo "yes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare release notes
        if: steps.releasable.outputs.yes == 'true'
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          awk -v tag="$TAG" '
            index($0, "## [" tag "]") == 1 {capture=1; next}
            capture && /^## \[/ {exit}
            capture {print}
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Verify tag immutability
        if: steps.releasable.outputs.yes == 'true'
        id: existing
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          TESTED_SHA=$(git rev-parse HEAD)
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            TAG_SHA=$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')
            echo "exists=true" >> "$GITHUB_OUTPUT"
            if [ "$TAG_SHA" != "$TESTED_SHA" ]; then
              echo "Tag $TAG already points to $TAG_SHA, tested commit is $TESTED_SHA. Refusing to move tag." >&2
              exit 1
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create immutable tag
        if: steps.releasable.outputs.yes == 'true' && steps.existing.outputs.exists == 'false'
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG" "$(git rev-parse HEAD)"
          git push origin "$TAG"

      - name: Create GitHub Release if missing
        if: steps.releasable.outputs.yes == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" --target "$(git rev-parse HEAD)" --title "$TAG" --notes-file release-notes.md
          fi
