name: Auto Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tested commit
        id: commit
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.commit.outputs.sha }}
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION=$(awk '/^version:/ {print $2; exit}' SKILL.md)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Resolve release state
        id: state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ! grep -Fq "## [$TAG]" CHANGELOG.md; then
            echo "action=skip" >> "$GITHUB_OUTPUT"
            echo "No CHANGELOG section for $TAG; nothing to release."
            exit 0
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "action=skip" >> "$GITHUB_OUTPUT"
            echo "$TAG is already released; tag remains immutable."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "action=release-existing-tag" >> "$GITHUB_OUTPUT"
          else
            echo "action=create-tag-and-release" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare release notes
        if: steps.state.outputs.action != 'skip'
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          awk -v tag="$TAG" '
            index($0, "## [" tag "]") == 1 {capture=1; next}
            capture && /^## \[/ {exit}
            capture {print}
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Create immutable tag
        if: steps.state.outputs.action == 'create-tag-and-release'
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG" "$(git rev-parse HEAD)"
          git push origin "$TAG"

      - name: Create GitHub Release
        if: steps.state.outputs.action != 'skip'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md
