name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  source-to-deck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r assets/requirements.txt

      - name: v4.1 architecture contracts
        run: python assets/tests/test_v4_contracts.py

      - name: Universal source ingestion and coverage
        run: python assets/tests/test_source_to_deck.py

      - name: Legacy renderer smoke
        run: |
          python assets/tests/test_archetypes.py
          python assets/tests/test_render_smoke.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install PptxGenJS fallback runtime
        run: npm install --ignore-scripts

      - name: Generate deterministic fallback deck
        run: |
          node --check runtime/pptxgenjs/render.js
          node runtime/pptxgenjs/render.js assets/fixtures/v4.1-deck.json /tmp/v4.1-runtime.pptx assets/fixtures/v4.1-assets.json brand/vivo/template-manifest.json

      - name: Validate generated PPTX and no-silent-loss
        run: |
          python assets/tests/test_pptx_content_preservation.py assets/fixtures/v4.1-deck.json /tmp/v4.1-runtime.pptx
          python assets/validate_pptx.py /tmp/v4.1-runtime.pptx --template-manifest brand/vivo/template-manifest.json --json > /tmp/pptx-qa.json
          cat /tmp/pptx-qa.json

      - name: Install real-render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-impress poppler-utils

      - name: Render PPTX and create montage
        run: |
          python assets/render_pptx.py /tmp/v4.1-runtime.pptx --out-dir /tmp/v4.1-render
          test -s /tmp/v4.1-render/montage.png
          test -s /tmp/v4.1-render/v4.1-runtime.pdf
