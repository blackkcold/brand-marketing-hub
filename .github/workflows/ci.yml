name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r assets/requirements.txt
      - name: v4 contracts
        run: python assets/tests/test_v4_contracts.py
      - name: Archetype smoke
        run: python assets/tests/test_archetypes.py
      - name: Renderer smoke
        run: python assets/tests/test_render_smoke.py
